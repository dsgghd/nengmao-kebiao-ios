name: NengmaoKeBiao
options:
  bundleIdPrefix: com.kebiao
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

# 说明：本工程同时也提交了手写的 NengmaoKeBiao.xcodeproj（Windows 上没有 XcodeGen，
# 用 tools/gen_xcodeproj.py 生成）。两条路都可用：
#   * 已有 .xcodeproj -> 直接 open，不用装 XcodeGen；
#   * 想用 XcodeGen 重新生成 -> 本文件必须与 pbxproj 保持一致（文件列表相同）。
targets:
  NengmaoKeBiao:
    type: application
    platform: iOS
    # 只用显式 Swift 文件，避免把 Info.plist 当资源复制，也避免 Web/Scripts 被
    # “普通 group”和“folder reference”重复打进 App。
    sources:
      - path: NengmaoKeBiao/MainViewController.swift
      - path: NengmaoKeBiao/ImportViewController.swift
      - path: NengmaoKeBiao/ReminderScheduler.swift
      - path: NengmaoKeBiao/WebStorage.swift
      - path: NengmaoKeBiao/LocalWebServer.swift
      - path: NengmaoKeBiao/CookieVault.swift
      - path: NengmaoKeBiao/JSLiteral.swift
      - path: NengmaoKeBiao/WebAssetPath.swift
      - path: NengmaoKeBiao/CourseMerger.swift
      - path: NengmaoKeBiao/WebStoreFile.swift
      - path: NengmaoKeBiao/Assets.xcassets
        buildPhase: resources
      - path: NengmaoKeBiao/Web
        type: folder
        buildPhase: resources
      - path: NengmaoKeBiao/Scripts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kebiao.app.ios
        INFOPLIST_FILE: NengmaoKeBiao/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"