name: ios-build

# 在 GitHub 的 macOS runner 上真正编译 iOS 工程（Windows 上做不到这件事），
# 并打出一个**未签名 IPA**——你可以用 Sideloadly / AltStore 拿自己的 Apple ID 签名安装。
#
# runner 自带 Xcode，所以这条路不需要你本机有任何 Apple 工具链。

on:
  push:
    paths:
      - "ios-build/**"
      - "install/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios-build/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios-build

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 静态校验（工程 / 资源 / 图标）
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make_assets.py --check
          python3 tools/validate_project.py

      - name: API 审计（用 runner 自带的 iPhoneOS SDK 头文件）
        run: |
          python3 tools/sdk_api_audit.py --verbose

      - name: 网页层与端到端测试（真 WebKit）
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install webkit
          python3 tools/webkit_tests.py
          python3 tools/import_e2e_tests.py

      - name: 编译到模拟器（免签名，先验证能过编译）
        run: |
          set -o pipefail
          xcodebuild \
            -project NengmaoKeBiao.xcodeproj \
            -scheme NengmaoKeBiao \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee simulator.log

      - name: 编译真机二进制（免签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project NengmaoKeBiao.xcodeproj \
            -scheme NengmaoKeBiao \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee device.log

      - name: 检查 .app 里资源是否齐全
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/NengmaoKeBiao.app"
          test -d "$APP" || { echo "没有生成 .app"; exit 1; }
          for f in Web/index.html Web/app.js Web/parser.js Web/schools-seed.js \
                   Web/vendor/xlsx.full.min.js Scripts/eams-scrape.js Scripts/generic-scrape.js \
                   Assets.car Info.plist; do
            test -e "$APP/$f" || { echo "缺少 $APP/$f"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist"
          file "$APP/NengmaoKeBiao"
          echo "资源清单检查通过"

      - name: 打成未签名 IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/NengmaoKeBiao.app"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # Sideloadly/AltStore 会重新签名；这里只保证 bundle 结构正确
          (cd out && zip -qry NengmaoKeBiao-unsigned.ipa Payload)
          ls -lh out/NengmaoKeBiao-unsigned.ipa
          unzip -l out/NengmaoKeBiao-unsigned.ipa | head -20

      - name: 上传产物（IPA + 日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nengmao-kebiao-ios
          path: |
            ios-build/out/NengmaoKeBiao-unsigned.ipa
            ios-build/simulator.log
            ios-build/device.log
          if-no-files-found: warn