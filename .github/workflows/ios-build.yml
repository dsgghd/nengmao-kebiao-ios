name: ios-build

# 在 GitHub 的 macOS runner 上编译 iOS 工程，产出未签名 IPA。
# Windows 上用 Sideloadly / AltStore 以本人 Apple ID 签名后即可安装。
on:
  push:
    paths:
      - "ios-build/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-build

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          xcodebuild -version
          xcodebuild -showsdks | tail -20

      - name: 编译真机二进制（免签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project NengmaoKeBiao.xcodeproj \
            -scheme NengmaoKeBiao \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee device.log

      - name: 打成未签名 IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/NengmaoKeBiao.app"
          test -d "$APP" || { echo "没有生成 .app"; exit 1; }
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry NengmaoKeBiao-unsigned.ipa Payload)
          ls -lh out/NengmaoKeBiao-unsigned.ipa

      - name: 校验 bundle
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/NengmaoKeBiao.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          for f in Web/index.html Web/app.js Web/parser.js Web/schools-seed.js \
                   Web/vendor/xlsx.full.min.js Scripts/eams-scrape.js Scripts/generic-scrape.js; do
            test -e "$APP/$f" || { echo "缺少 $f"; exit 1; }
          done
          file "$APP/NengmaoKeBiao"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nengmao-kebiao-ios
          path: |
            ios-build/out/NengmaoKeBiao-unsigned.ipa
            ios-build/device.log
          if-no-files-found: warn