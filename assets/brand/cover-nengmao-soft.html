<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1536px;height:1024px;overflow:hidden;background:#F2EEE3;
font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}
.bar{position:absolute;left:44px;top:110px;width:44px;height:804px;background:#D33228}
.ochre{position:absolute;left:500px;top:30px;width:300px;height:300px;border-radius:50%;background:#C9972B}
.block{position:absolute;left:0;bottom:0;width:196px;height:204px;background:#141414}
.panda{position:absolute;left:70px;top:100px;width:660px;height:630px;filter:drop-shadow(14px 16px 0 #E7E1D2)}
.panel{position:absolute;right:0;top:0;width:756px;height:1024px;background:#141414;overflow:hidden}
.ochre2{position:absolute;right:-150px;bottom:-160px;width:430px;height:430px;border-radius:50%;background:#C9972B}
.redblock{position:absolute;right:96px;top:94px;width:64px;height:64px;background:#D33228}
.copy{position:absolute;left:112px;top:196px;width:560px;color:#F2EEE3}
.kicker{font-size:17px;letter-spacing:.34em;color:#C9972B;font-weight:700}
.title{margin-top:40px;font-size:130px;line-height:1.02;font-weight:900;letter-spacing:-.06em;white-space:nowrap}
.rule{width:360px;height:24px;background:#D33228;margin-top:26px}
.tag{margin-top:54px;font-size:44px;line-height:1.35;font-weight:800;letter-spacing:-.02em}
.tag em{font-style:normal;color:#D33228}
.note{margin-top:64px;font-size:19px;letter-spacing:.12em;color:#CFC7B4;font-weight:500}
</style></head><body>
<div class="bar"></div><div class="ochre"></div><div class="block"></div>
<img class="panda" src="panda-cutout.png">
<div class="panel">
  <div class="ochre2"></div><div class="redblock"></div>
  <div class="copy">
    <div class="kicker">TIMETABLE / 2026</div>
    <div class="title">能猫课表</div>
    <div class="rule"></div>
    <div class="tag">把课表<br><em>变成今天。</em></div>
    <div class="note">本地优先 · 自动识别 · 数据只在本机</div>
  </div>
</div>
</body></html>
